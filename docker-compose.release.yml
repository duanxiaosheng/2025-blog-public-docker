services:
  blog:
    image: ${IMAGE_NAME:-duanxiaosheng/2025-blog-local-docker:latest}
    container_name: 2025-blog-local-docker
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      - ./data:${DATA_DIR:-/app/data}
    restart: unless-stopped
