services:
  blog:
    build: .
    container_name: 2025-blog-local-docker
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret-after-deploy}
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      - ./data:${DATA_DIR:-/app/data}
    restart: unless-stopped
